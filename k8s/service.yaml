apiVersion: v1
kind: Service
metadata:
  name: demo-web
  namespace: demo
  annotations:
    # 내부(사설) Load Balancer — 온프레미스 개발 PC에서 VPN 통해 접속
    service.beta.kubernetes.io/azure-load-balancer-internal: "true"
spec:
  type: LoadBalancer
  selector:
    app: demo-web
  ports:
    - port: 80
      targetPort: 80
